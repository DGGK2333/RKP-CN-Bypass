name: Bug report / 问题反馈
description: 反馈模块在你的设备上不生效或表现异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 README 的「适用范围」「已知限制」「验证」「排障速查」，以及
        [TESTING.md](https://github.com/DGGK2333/RKP-CN-Bypass/blob/main/TESTING.md)，
        并确认：

        - 设备为小米 / 红米国行 ROM，且 `getprop odm.xiaomi.security.tee.rkp_only` 为 `true`
        - TEE 本身正常（`keystore_cli_v2 generate` 能输出 `Hardware:` 段）
        - 已重启，且模块目录下没有 `disable` 文件

        > 提交日志前请去掉 IMEI、序列号、账号、完整 keybox、私钥与 Play Integrity token 等敏感信息。
        > `ATTESTATION_KEYS_NOT_PROVISIONED` 只是最终表现，请尽量按下方的「日志」字段采集分层证据。

  - type: input
    id: device
    attributes:
      label: 设备型号 / 代号
      placeholder: 例如 Xiaomi 17 Pro Max / popsicle
    validations:
      required: true

  - type: input
    id: rom
    attributes:
      label: ROM 版本
      description: 系统版本 + 版本号，例如 HyperOS 3.0.1.0 / OS44
    validations:
      required: true

  - type: dropdown
    id: root
    attributes:
      label: Root 方案
      options:
        - Magisk
        - KernelSU
        - KernelSU Next / SukiSU / ReSukiSU
        - APatch
        - 其他
    validations:
      required: true

  - type: input
    id: hwc
    attributes:
      label: 模块安装后的属性值
      description: 执行 `getprop ro.boot.hwc` 与 `getprop odm.xiaomi.security.tee.rkp_only` 的返回值
      placeholder: ro.boot.hwc=GL, rkp_only=true
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: 现象描述
      description: 例如 Play Integrity 三个字段的结果、报错信息、复现步骤
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: |
        建议提供以下命令的输出：

        ```sh
        logcat -d --pid=$(pidof keystore2) | grep -E 'CN device with TEE level|remote provisioned|without a provided'
        cat /data/local/tmp/rkp_cn_bypass.log
        ```
      render: shell
    validations:
      required: false
