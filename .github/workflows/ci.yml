name: CI

# push / PR 时校验源码编码、刷入包结构与 update.json 一致性。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify module package
        run: python3 build.py --verify

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: RKP-CN-Bypass-zip
          path: dist/
