name: Release

# 推送 v* 标签时自动打包并发布 Release。
# 发布前请先更新 module.prop、update.json、CHANGELOG.md，--verify 会校验三者一致。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build and verify
        run: python3 build.py --verify

      - name: Check tag matches module.prop
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -E '^version=' module.prop | cut -d= -f2)"
          if [ "v${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与 module.prop version=${version} 不一致" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -E '^version=' module.prop | cut -d= -f2)"
          awk -v v="## ${version}" '
            index($0, v) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/release-notes.md
          test -s dist/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            "dist/RKP-CN-Bypass-${version}.zip" \
            "dist/SHA256SUMS" \
            --title "RKP CN Bypass ${version}" \
            --notes-file dist/release-notes.md
